server {
  listen 80;
  server_name ris3.net;

  root /usr/share/nginx/forgemind;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API backend (proxy al puerto 3030 del docker compose)
  location /api/v1/ {
    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Firebase Auth custom domain proxy (permite login con ris3.net en vez de firebaseapp.com)
  location /__/auth/ {
    proxy_pass https://forgeminproyect.firebaseapp.com/__/auth/;
    proxy_ssl_server_name on;
    proxy_set_header Host forgeminproyect.firebaseapp.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # assets estaticos cacheables
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback (rutas dinamicas tipo /projects/:id se resuelven en cliente)
  try_files $uri $uri/ $uri.html /index.html;

  # seguridad
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}