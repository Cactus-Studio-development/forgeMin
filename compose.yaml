services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forgemind-backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: 3030
    ports:
      - "3030:3030"
    volumes:
      - /opt/services/variables/service-account-forgemind.json:/app/backend/service-account.json:ro